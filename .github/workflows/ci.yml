name: CI
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - name: Sync pinned Python dependencies
        run: uv sync --frozen
      - name: Start isolated Postgres test service
        run: mise run dev
      - uses: docker/setup-buildx-action@v3
        id: buildx
      - name: Build the dependency image
        id: dependencies
        uses: docker/build-push-action@v6
        with:
          context: .
          builder: ${{ steps.buildx.outputs.name }}
          target: dependencies
          platforms: linux/amd64
          tags: swingset-dependencies:test
          load: true
          provenance: false
          sbom: false
          cache-from: type=gha,scope=swingset-dependencies
          cache-to: type=gha,mode=max,scope=swingset-dependencies
      - name: Build and test the shipped environment
        shell: bash
        env:
          DEPENDENCY_IMAGE_DIGEST: ${{ steps.dependencies.outputs.digest }}
          BUILDX_BUILDER: ${{ steps.buildx.outputs.name }}
        run: |
          dependency_digest="$DEPENDENCY_IMAGE_DIGEST"
          docker buildx build --load --platform linux/amd64 --target test --build-arg DEPENDENCY_IMAGE_DIGEST="$dependency_digest" --build-arg SOURCE_REVISION="$GITHUB_SHA" -t swingset-test .
          uv run python -m swingset.dev.ci swingset-test
          docker buildx build --load --platform linux/amd64 --target runtime --build-arg DEPENDENCY_IMAGE_DIGEST="$dependency_digest" --build-arg SOURCE_REVISION="$GITHUB_SHA" -t swingset-runtime .
