# swingset traces events from this date onward. Events that ended earlier get
# no rows; the registry mirror stays whole and earlier registry placements keep
# a null event id. See docs/reference/backfill.md, "The start-date rule".
history_start = 2010-01-01

[sources.wsdc_calendar]
enabled = true
index_urls = ["https://worldsdc.com/events/"]

# Bootstrap uses an archived comparison dump and an explicitly seeded sweep.
[sources.wsdc_registry]
enabled = true
index_urls = []

# Owner reported permission received on 2026-09-08; see the source playbook.
[sources.eepro]
enabled = true
index_urls = ["https://eepro.com/results/event.php"]

[sources.scoringdance]
enabled = true
index_urls = [
  "https://scoring.dance/sitemap.xml",
  "https://scoring.dance/enUS/events/",
]

[sources.wdr]
enabled = true
index_urls = []

# danceconvention.net: the events archive and WSDC results tabs (D-0255).
# Off until the rollout in docs/reference/sources/danceconvention.md §14.
[sources.dcn]
enabled = false
index_urls = ["https://danceconvention.net/eventdirector/en/eventsarchive"]

# Each acquisition phase ends with up to this many seconds of CDX index
# queries for the enabled platforms, one per source, prefix and capture year;
# finished years are queried once (D-0184). Unset disables the step.
[scheduling]
archive_index_seconds = 120
# Backpressure counts superseded parse rows, which never run, even under
# schema 34; these stay above that residue (D-0221, D-0230).
# Backpressure counts superseded parse rows as runnable (3,566 after the
# contract 5 re-parse), so the item limit sits 4,400 above them until
# maintenance item 13 stops counting them (D-0230, D-0244).
pending_parse_items = 8000
pending_parse_bytes = 536870912
# A release build takes minutes and holds the heavy lock, so builds are paced;
# pacing never gates acquisition (D-0198, D-0199).
build_interval_seconds = 86400 # daily again after phase 4 freed room (D-0245)
# While builds are due and release has not progressed for this many build
# intervals, derive runs only parse and link units (0 turns it off).
release_lag_intervals = 2
# The inventory is one global unit of about 4 GB (F18). With phase 3 its
# re-run ends at the first unchanged unit (its years and the links that read
# it, as equivalences), so 12 hours again (D-0210; D-0227's 48 hours and
# D-0228's 7 days ended with the phase 3 switch). `history_interval_seconds` is no longer read:
# history is per year (D-0222).
inventory_interval_seconds = 43200

# The live database may grow to this size before the pipeline pauses itself
# (D-0186; D-0194 and D-0196 raised it while the retention planner cannot
# run and every source change re-derives the whole graph). Deleting rows
# frees pages but not file space; see the operation guide's disk-space
# section for reclaim.
[retention]
max_database_bytes = "50GB" # 40.7 GB after the 2026-10-11 reclaim, plus room (D-0245)
# Backups are local only until segmented backups (architecture phase 4;
# D-0203): each successful backup removes every older run_* checkpoint and
# keeps the one it wrote. Operator-named checkpoints are never touched.
checkpoint_keep_recent = 1
checkpoint_max_age = "0s"

# Optional event bookkeeping is off in production (D-0204). Nothing these
# stages write gates acquisition once pressure is off: the pressure gate opens.
# Their code and stored rows stay. Takes effect with the phase 1 package; the
# 019 package ignores this table. See docs/reference/scheduling.md,
# "Stage switches".
[stages]
event_pressure = false
event_progress_refresh = false
event_blocker_observations = false

# How a release is assembled (D-0224). `partitioned` builds it from partition
# artifacts selected by current pointers; `whole` assembles the same
# artifacts in memory; `closure` is the phase 2 closure path, which builds an
# empty release after the phase 3 switch (F30), so it is no fallback. Read at
# build time; a change re-queues nothing. `streamed_lock` keeps the heavy
# lock on a partitioned build, so derive runs no unit beside it, until the
# worker's post-check measures the build under 2 GB with derive active.
# See docs/guides/operation.md, "Release path".
[release]
path = "partitioned"
streamed_lock = true

# The maintain loop's storage tasks (architecture phase 4; D-0229, D-0231,
# D-0232). Each daily tick evicts up to `evict_refs_per_tick` references of
# old cold generations into packs and packs up to `pack_rows_per_tick` parse
# and label bodies; the collector sweeps every `collect_every_days`; the
# restore drill installs the newest backup set every `drill_every_days` into
# `<drill_dir>/swingset-drill-<set>`. Read by maintain; a change re-queues
# nothing. See docs/reference/operations.md, "Maintain storage tasks".
[storage]
evict_refs_per_tick = 2000000
pack_rows_per_tick = 20000
collect_every_days = 7
drill_every_days = 7
drill_dir = "/var/tmp"
