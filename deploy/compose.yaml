# Generate network.json, rehearsal.json, Squid and CoreDNS configuration before
# applying this file. Every external volume must already have the owned label.
x-worker: &worker
  image: ${SWINGSET_IMAGE:?immutable proved runtime image required}
  user: "10001:10001"
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  restart: unless-stopped
  init: false
  environment: &environment
    SWINGSET_ENV: dryrun
    SWINGSET_RUNTIME_IMAGE: ${SWINGSET_RUNTIME_IMAGE:?qualified verified runtime OCI identity required}
    SWINGSET_REHEARSAL_POLICY: /run/swingset-config/rehearsal.json
    SWINGSET_BACKUP_CHECK_SOCKET: /run/swingset-checker/check.sock
    SWINGSET_BACKUP_CHECK_ROOT: /var/lib/swingset/checkpoints
    SWINGSET_R2_ENDPOINT: ${SWINGSET_R2_ENDPOINT:?scoped R2 endpoint required}
    SWINGSET_R2_BUCKET: swingset-backups
    SWINGSET_OOB_HOLD: "0"
    HTTP_PROXY: http://${SWINGSET_PROXY_IP:?}:3128
    HTTPS_PROXY: http://${SWINGSET_PROXY_IP}:3128
    ALL_PROXY: http://${SWINGSET_PROXY_IP}:3128
    NO_PROXY: ""
    HF_HUB_DISABLE_XET: "1"
    HF_HUB_DISABLE_TELEMETRY: "1"
    PYTHONDONTWRITEBYTECODE: "1"
    XDG_CACHE_HOME: /var/lib/swingset-spill/cache
    HF_HOME: /var/lib/swingset-spill/huggingface
    SWINGSET_ALERT_URL_FILE: /run/secrets/alert-url
    SWINGSET_DEADMAN_URL_FILE: /run/secrets/deadman-url
    TMPDIR: /var/lib/swingset-spill/tmp
    TZ: UTC
  volumes:
    - state:/var/lib/swingset
    - spill:/var/lib/swingset-spill
    - runtime:/var/lib/swingset-runtime
    - checker-ipc:/run/swingset-checker
    - ${SWINGSET_CONFIG_DIRECTORY:?}:/run/swingset-config:ro
    - ${SWINGSET_AUTHORIZATION_DIRECTORY:?}:/run/swingset-authorization:ro
    - ${SWINGSET_HOLDS_DIRECTORY:?}:/run/swingset-holds:ro
  secrets: [worker-dsn, alert-url, deadman-url]
  dns: ["${SWINGSET_DNS_IP:?}"]
  dns_opt: [timeout:1, attempts:1]
  sysctls:
    net.ipv6.conf.all.disable_ipv6: "1"
    net.ipv6.conf.default.disable_ipv6: "1"
  stop_grace_period: 45s
  logging: &logging
    driver: json-file
    options: { max-size: 10m, max-file: "5" }

services:
  acquire-plan:
    <<: *worker
    command: [python, -m, swingset.deploy.runtime, scheduler, --group, acquire-plan]
    labels:
      {
        io.swingset.deployment: "${SWINGSET_DEPLOYMENT_ID:?}",
        io.swingset.role: acquire-plan,
        io.swingset.guarded: "true",
      }
    networks:
      workers: { ipv4_address: "${SWINGSET_ACQUIRE_IP:?}" }
    mem_limit: 2g
    memswap_limit: 2g
    cpus: 2
    healthcheck: &health
      test: [CMD, python, -m, swingset.deploy.runtime, liveness]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 150s

  derive:
    <<: *worker
    command: [python, -m, swingset.deploy.runtime, scheduler, --group, derive]
    labels:
      {
        io.swingset.deployment: "${SWINGSET_DEPLOYMENT_ID}",
        io.swingset.role: derive,
        io.swingset.guarded: "true",
      }
    networks:
      workers: { ipv4_address: "${SWINGSET_DERIVE_IP:?}" }
    mem_limit: 6g
    memswap_limit: 6g
    cpus: 6
    stop_grace_period: 120s
    healthcheck: *health

  release-maintain:
    <<: *worker
    command: [python, -m, swingset.deploy.runtime, scheduler, --group, release-maintain]
    labels:
      {
        io.swingset.deployment: "${SWINGSET_DEPLOYMENT_ID}",
        io.swingset.role: release-maintain,
        io.swingset.guarded: "true",
      }
    networks:
      workers: { ipv4_address: "${SWINGSET_RELEASE_IP:?}" }
    mem_limit: 8g
    memswap_limit: 8g
    cpus: 4
    secrets: [worker-dsn, hf-token, r2-access-key, r2-secret-key, alert-url, deadman-url]
    healthcheck: *health

  jobs:
    <<: *worker
    command: [python, -m, swingset.deploy.runtime, scheduler, --group, jobs]
    labels:
      {
        io.swingset.deployment: "${SWINGSET_DEPLOYMENT_ID}",
        io.swingset.role: jobs,
        io.swingset.guarded: "true",
      }
    networks:
      workers: { ipv4_address: "${SWINGSET_JOBS_IP:?}" }
    mem_limit: 1g
    memswap_limit: 1g
    cpus: 1
    secrets: [worker-dsn, r2-access-key, r2-secret-key, alert-url, deadman-url]
    healthcheck: *health

  health:
    <<: *worker
    command: [python, -m, swingset.deploy.runtime, health]
    labels:
      {
        io.swingset.deployment: "${SWINGSET_DEPLOYMENT_ID}",
        io.swingset.role: health,
        io.swingset.guarded: "true",
      }
    networks:
      workers: { ipv4_address: "${SWINGSET_HEALTH_IP:?}" }
    mem_limit: 256m
    memswap_limit: 256m
    cpus: 0.2
    secrets: [worker-dsn, alert-url, deadman-url]
    healthcheck: *health

  checker:
    <<: *worker
    command: [python, -m, swingset.deploy.runtime, checker]
    labels:
      {
        io.swingset.deployment: "${SWINGSET_DEPLOYMENT_ID}",
        io.swingset.role: checker,
        io.swingset.guarded: "true",
      }
    networks:
      workers: { ipv4_address: "${SWINGSET_CHECKER_IP:?}" }
    mem_limit: 1g
    memswap_limit: 1g
    cpus: 2
    secrets: [scratch-admin-dsn]
    healthcheck:
      test: [CMD, python, -m, swingset.deploy.runtime, checker-readiness]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 150s

  scratch-postgres:
    image: postgres:17.11@sha256:67f41722b7a8cbdb868a44a4995c846eddfdc2973bccb291ce937dce88ad5675
    environment:
      POSTGRES_PASSWORD_FILE: /run/secrets/scratch-password
      POSTGRES_INITDB_ARGS: --locale=C --encoding=UTF8 --auth-host=scram-sha-256
      POSTGRES_HOST_AUTH_METHOD: scram-sha-256
      TZ: UTC
    secrets: [scratch-password]
    command: [postgres, -c, fsync=off, -c, full_page_writes=off]
    volumes: ["scratch:/var/lib/postgresql/data"]
    networks:
      workers: { ipv4_address: "${SWINGSET_SCRATCH_IP:?}" }
    mem_limit: 8g
    memswap_limit: 8g
    cpus: 6
    shm_size: 256m
    restart: unless-stopped
    stop_grace_period: 120s
    logging: *logging

  database-relay:
    image: ${SWINGSET_IMAGE}
    user: "10001:10001"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    command: [python, -m, swingset.deploy.relay, --target, "${SWINGSET_SHARED_POSTGRES_SERVICE:?}"]
    networks:
      workers: { ipv4_address: "${SWINGSET_DATABASE_RELAY_IP:?}" }
      dokploy-network: {}
    ports: ["127.0.0.1:${SWINGSET_DATABASE_RELAY_PORT:?}:5432"]
    mem_limit: 64m
    memswap_limit: 64m
    cpus: 0.2
    restart: unless-stopped
    stop_grace_period: 45s
    logging: *logging

  proxy:
    image: ubuntu/squid@sha256:6a097f68bae708cedbabd6188d68c7e2e7a38cedd05a176e1cc0ba29e3bbe029
    user: "13:13"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    entrypoint: [/usr/sbin/squid]
    command: [-N, -f, /etc/squid/squid.conf]
    volumes:
      - ${SWINGSET_CONFIG_DIRECTORY}/squid.conf:/etc/squid/squid.conf:ro
    networks:
      workers: { ipv4_address: "${SWINGSET_PROXY_IP}" }
      dokploy-network: {}
    mem_limit: 256m
    memswap_limit: 256m
    cpus: 1
    restart: unless-stopped
    stop_grace_period: 45s
    logging: *logging

  resolver:
    image: coredns/coredns@sha256:0a9d8c8ddf34347eb59aad9a8784f0710de88d6d112726d11d271f9bc6daca26
    user: "10001:10001"
    read_only: true
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    command: [-conf, /etc/coredns/Corefile]
    volumes: ["${SWINGSET_CONFIG_DIRECTORY}/Corefile:/etc/coredns/Corefile:ro"]
    sysctls: { net.ipv4.ip_unprivileged_port_start: "0" }
    networks:
      workers: { ipv4_address: "${SWINGSET_DNS_IP}" }
    mem_limit: 64m
    memswap_limit: 64m
    cpus: 0.2
    restart: unless-stopped
    stop_grace_period: 45s
    logging: *logging

networks:
  workers:
    name: ${SWINGSET_WORKER_NETWORK:?}
    internal: true
    enable_ipv6: false
    driver: bridge
    ipam:
      config: [{ subnet: "${SWINGSET_WORKER_SUBNET:?}" }]
    labels: { io.swingset.deployment: "${SWINGSET_DEPLOYMENT_ID}" }
  dokploy-network:
    external: true

volumes:
  state: { external: true, name: "${SWINGSET_STATE_VOLUME:?}" }
  spill: { external: true, name: "${SWINGSET_SPILL_VOLUME:?}" }
  runtime: { external: true, name: "${SWINGSET_RUNTIME_VOLUME:?}" }
  checker-ipc: { external: true, name: "${SWINGSET_CHECKER_IPC_VOLUME:?}" }
  scratch: { external: true, name: "${SWINGSET_SCRATCH_VOLUME:?}" }

secrets:
  worker-dsn: { file: "${SWINGSET_SECRETS_DIRECTORY:?}/worker-dsn" }
  hf-token: { file: "${SWINGSET_SECRETS_DIRECTORY}/hf-token" }
  r2-access-key: { file: "${SWINGSET_SECRETS_DIRECTORY}/r2-access-key" }
  r2-secret-key: { file: "${SWINGSET_SECRETS_DIRECTORY}/r2-secret-key" }
  scratch-admin-dsn: { file: "${SWINGSET_SECRETS_DIRECTORY}/scratch-admin-dsn" }
  scratch-password: { file: "${SWINGSET_SECRETS_DIRECTORY}/scratch-password" }
  alert-url: { file: "${SWINGSET_SECRETS_DIRECTORY}/alert-url" }
  deadman-url: { file: "${SWINGSET_SECRETS_DIRECTORY}/deadman-url" }
