# Repo-local tooling for working on swingset itself. `mise install` fetches
# the formatters; `mise run fmt` formats everything hand-written. Nothing
# here needs `nix develop` or the project venv, so fmt works from any shell
# with mise on the path. Python, uv, and mypy still come from flake.nix.

# Formatter versions are pinned exactly so `mise run fmt` output never shifts
# under us; bump them deliberately (and re-run fmt) like any other update.
[tools]
# oxfmt's npm backend needs a node.
node = "24"
"npm:oxfmt" = "0.64.0"
# A Rust port of nixfmt with byte-identical output. The official nixfmt
# release ships only a Linux x86-64 binary, so it cannot run on the Macs.
"aqua:Mic92/nixfmt-rs" = "0.5.3"
# Keep in step with the ruff version in uv.lock, which is what `ruff check`
# runs under in CI. The pins are separate because uv.lock's ruff needs the
# nix Python to run, and fmt should not.
ruff = "0.16.6"
shfmt = "3.13.1"
taplo = "0.10.0"

[tasks.fmt]
description = "Format every hand-written file in the repo"
run = [
  # .nix — nixfmt (RFC 166 style).
  "jj file list -T 'path ++ \"\\0\"' 'glob:**/*.nix & ~glob:journal/evidence/** & ~glob:**/fixtures/**' | xargs -0 nixfmt",
  # .toml — taplo.
  "jj file list -T 'path ++ \"\\0\"' 'glob:**/*.toml & ~glob:journal/evidence/** & ~glob:**/fixtures/**' | xargs -0 taplo fmt",
  # .sh — shfmt.
  "jj file list -T 'path ++ \"\\0\"' 'glob:**/*.sh & ~glob:journal/evidence/** & ~glob:**/fixtures/**' | xargs -0 shfmt --write --indent 2",
  # .py — ruff's formatter. Its excludes live in pyproject.toml ([tool.ruff]).
  "ruff format .",
  # .json, .md, .yml, .html — oxfmt, repo-wide. Machine-written and captured
  # files are excluded via .gitignore + .prettierignore, both of which oxfmt
  # reads by default.
  "oxfmt",
]
