# Repo-local tooling for working on swingset itself. `mise install` fetches
# the formatters; `mise run fmt` formats everything hand-written. Nothing
# here needs `nix develop` or the project venv, so fmt works from any shell
# with mise on the path. The Postgres bookmark uses mise Python and uv;
# flake.nix remains for the production SQLite worker until the switch.

# Formatter versions are pinned exactly so `mise run fmt` output never shifts
# under us; bump them deliberately (and re-run fmt) like any other update.
[tools]
python = "3.12.16"
uv = "0.13.7"
# oxfmt's npm backend needs a node.
node = "24"
"npm:oxfmt" = "0.64.0"
# A Rust port of nixfmt with byte-identical output. The official nixfmt
# release ships only a Linux x86-64 binary, so it cannot run on the Macs.
"aqua:Mic92/nixfmt-rs" = "0.5.3"
# Keep in step with the ruff version in uv.lock, which is what `ruff check`
# runs under in CI. The pins are separate because uv.lock's ruff needs the
# nix Python to run, and fmt should not.
ruff = "0.16.6"
shfmt = "3.13.1"
taplo = "0.10.0"

[env]
TMPDIR = "/tmp"

[tasks.dev]
description = "Sync dependencies and ready the native local Postgres test service"
run = "uv run python -m swingset.dev.commands dev"

[tasks.db]
description = "Start or reuse the separate persistent development Postgres service"
run = "uv run python -m swingset.dev.commands db"

[tasks.tunnel]
description = "Forward localhost to Rhuidean's loopback-only Postgres relay"
run = "uv run python -m swingset.deploy.tunnel tunnel"

[tasks.psql]
description = "Read SQL through the tunnel with one named keychain credential"
run = "uv run python -m swingset.deploy.tunnel psql"

[tasks.test]
description = "Run selected tests, or the reviewed core, against isolated Postgres databases"
run = "uv run python -m swingset.dev.commands test"

[tasks.test-watch]
description = "Watch source and tests; coalesce edits into one selected test run at a time"
run = "uv run python -m swingset.dev.commands test-watch"

[tasks.check]
description = "Run reviewed core tests, Ruff and mypy"
run = "uv run python -m swingset.dev.commands check"

[tasks.evidence-size]
description = "Report evidence sizes; reject files over 1 MiB and more than 200 KiB of new evidence per change"
run = "python3 journal/tools/evidence_size.py"

[tasks.session-start]
description = "Take or refresh the one agent-session lock for this checkout (pass -- --label <you>)"
run = "python3 journal/tools/agent_session.py start"

[tasks.session-end]
description = "Release the agent-session lock"
run = "python3 journal/tools/agent_session.py end"

[tasks.fmt]
description = "Format every hand-written file in the repo"
run = [
  # .nix — nixfmt (RFC 166 style).
  "jj file list -T 'path ++ \"\\0\"' 'glob:**/*.nix & ~glob:journal/evidence/** & ~glob:**/fixtures/**' | xargs -0 -r nixfmt",
  # .toml — taplo.
  "jj file list -T 'path ++ \"\\0\"' 'glob:**/*.toml & ~glob:journal/evidence/** & ~glob:**/fixtures/**' | xargs -0 -r taplo fmt",
  # .sh — shfmt.
  "jj file list -T 'path ++ \"\\0\"' 'glob:**/*.sh & ~glob:journal/evidence/** & ~glob:**/fixtures/**' | xargs -0 -r shfmt --write --indent 2",
  # .py — ruff's formatter. Its excludes live in pyproject.toml ([tool.ruff]).
  "ruff format .",
  # .json, .md, .yml, .html — oxfmt, repo-wide. Machine-written and captured
  # files, and .toml (taplo's), are excluded via .gitignore + .prettierignore,
  # both of which oxfmt reads by default.
  "oxfmt",
]
